<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NOVACORE — The Hall</title>
  <meta name="description" content="Novacore World. A cinematic preview of the operations hall. Click the mark, the walls, or the aisle." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div class="bar bar-top" aria-hidden="true"></div>
  <div class="bar bar-bottom" aria-hidden="true"></div>

  <main class="stage" id="stage">
    <div class="still" id="still">
      <video src="assets/video/hall-loop.mp4" poster="assets/img/hall.jpg" autoplay muted loop playsinline></video>
      <div class="screens" aria-hidden="true"></div>
      <div class="floor" aria-hidden="true"></div>
      <div class="vignette" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>

      <button class="hot mark" data-film="mark" style="left:50%;top:33%" aria-label="Wake the mark">
        <span>Wake the mark</span>
      </button>
      <button class="hot left" data-film="left-wall" style="left:16%;top:38%" aria-label="Read the left wall">
        <span>Read the left wall</span>
      </button>
      <button class="hot right" data-film="right-wall" style="left:84%;top:38%" aria-label="Read the right wall">
        <span>Read the right wall</span>
      </button>
      <button class="hot aisle" data-film="aisle" style="left:50%;top:72%" aria-label="Walk the aisle">
        <span>Walk the aisle</span>
      </button>
    </div>

    <header class="chrome">
      <p class="brand">NOVACORE</p>
      <p class="meta">Place 01 · The Hall · still locked</p>
    </header>

    <aside class="card" id="card" hidden>
      <p class="kicker" id="card-kicker">Moment</p>
      <h2 id="card-title">Wake the mark</h2>
      <p id="card-body"></p>
      <p class="fine" id="card-fine"></p>
      <button class="close" id="close" type="button">Return to the hall</button>
    </aside>

    <footer class="dock">
      <p>Workers <strong>462</strong> · <strong>463</strong> · SOGNI tokens · films not rendered</p>
      <a href="world/world.yaml">world.yaml</a>
      <a href="ROADMAP.md">daily builds</a>
    </footer>
  </main>
  <script src="assets/js/main.js"></script>
</body>
</html>
